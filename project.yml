name: AppLocker

options:
  bundleIdPrefix: com.mirxa
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "3.7"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "48P296BWWP"

schemes:
  AppLocker:
    build:
      targets:
        AppLocker: all
    run:
      config: Debug
    archive:
      config: Release

  AppLockerCompanion:
    build:
      targets:
        AppLockerCompanion: all
    run:
      config: Debug
    archive:
      config: Release

targets:

  # ─────────────────────────────────────────────
  # macOS — main security app
  # ─────────────────────────────────────────────
  AppLocker:
    type: application
    platform: macOS
    deploymentTarget: "13.0"

    sources:
      - path: Sources/AppLocker
        excludes:
          - iOS/**         # iOS-only entry point and views
          - Assets.xcassets/**
        buildPhase: sources
      - path: Sources/AppLocker/Assets.xcassets
        buildPhase: resources

    info:
      path: SupportingFiles/macOS/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        NSCameraUsageDescription: Use the camera to capture encrypted intruder photos after failed unlock attempts.

    dependencies:
      - sdk: AppIntents.framework

    entitlements:
      path: SupportingFiles/macOS/AppLocker.entitlements

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirxa.AppLocker
        INFOPLIST_FILE: SupportingFiles/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/macOS/AppLocker.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTED_PLATFORMS: macosx
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEAD_CODE_STRIPPING: YES

    capabilities:
      iCloud:
        cloudKitServices: [CloudKit]
        containers:
          - iCloud.com.mirxa.AppLocker
      push: {}

  # ─────────────────────────────────────────────
  # iOS — companion app
  # ─────────────────────────────────────────────
  AppLockerCompanion:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: Sources/AppLocker/iOS
        buildPhase: sources
      - path: Sources/AppLocker/Shared
        buildPhase: sources
      - path: Sources/AppLocker/NotificationManager.swift
        buildPhase: sources
      - path: Sources/AppLocker/Assets.xcassets
        buildPhase: resources

    info:
      path: SupportingFiles/iOS/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: Use the camera to capture encrypted intruder photos after failed unlock attempts.
        NSFaceIDUsageDescription: Use Face ID to unlock AppLocker and approve protected actions.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

    dependencies:
      - sdk: AppIntents.framework
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework

    entitlements:
      path: SupportingFiles/iOS/AppLockerCompanion.entitlements

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirxa.AppLocker.Companion
        INFOPLIST_FILE: SupportingFiles/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/iOS/AppLockerCompanion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEAD_CODE_STRIPPING: YES

    capabilities:
      iCloud:
        cloudKitServices: [CloudKit]
        containers:
          - iCloud.com.mirxa.AppLocker
      push: {}
      backgroundModes:
        modes: [remoteNotification, fetch]
